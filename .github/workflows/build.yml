name: Build Eron OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            nasm \
            grub-pc-bin \
            xorriso \
            gcc-multilib \
            mtools

      - name: Build do Eron
        run: |
          make clean || true
          make

      - name: Listar arquivos gerados
        run: ls -lah

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: eron-iso
          path: eron.iso